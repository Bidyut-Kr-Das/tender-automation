  automation-v2-api:
    image: ghcr.io/laser-power-infra/django-worker:${APP_VERSION:-latest}
    command: sh -c "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_v2
    ports:
      - "4122:8000"
    restart: unless-stopped
    env_file:
      - .env.production
    networks:
      - infra

